<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cake Castle | Luxury Custom Cakes</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;color:#333;background:#fff}
html{scroll-behavior:smooth}

/* HERO VIDEO */
.hero{
position:relative;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:#fff;
overflow:hidden;
}
.hero video{
position:absolute;
top:0;left:0;
width:100%;height:100%;
object-fit:cover;
z-index:-1;
}
.hero::after{
content:'';
position:absolute;
width:100%;height:100%;
background:linear-gradient(rgba(0,0,0,0.5),rgba(255,122,162,0.3));
z-index:-1;
}
.hero .content{
background:rgba(0,0,0,0.3);
padding:40px;
border-radius:20px;
backdrop-filter:blur(10px);
}

/* BUTTON */
.btn{
background:#ff7aa2;
color:#fff;
padding:14px 28px;
border-radius:30px;
text-decoration:none;
display:inline-block;
margin-top:20px;
transition:0.3s;
}
.btn:hover{transform:scale(1.05)}

/* SECTION */
.section{padding:100px 20px;text-align:center}

/* PARALLAX */
.parallax{
background:url('images/parallax.jpg') center/cover fixed;
color:#fff;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
margin-top:40px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.8);
backdrop-filter:blur(12px);
padding:25px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.1);
transition:0.4s;
}
.card:hover{
transform:translateY(-12px);
}

/* GALLERY */
.gallery img{
width:100%;
border-radius:20px;
transition:0.4s;
}
.gallery img:hover{
transform:scale(1.08);
}

/* FORM */
form{
background:#ffe4e9;
padding:30px;
border-radius:20px;
max-width:500px;
margin:auto;
}
input,select,textarea{
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
}

/* ANIMATION */
.fade{
opacity:0;
transform:translateY(40px);
transition:1s;
}
.fade.show{
opacity:1;
transform:translateY(0);
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:#fff;
padding:18px;
border-radius:50%;
font-size:22px;
}
</style>
</head>

<body>

<!-- HERO VIDEO -->
<section class="hero">
<video autoplay muted loop>
<source src="video/banner.mp4" type="video/mp4">
</video>

<div class="content">
<h1>Cake Castle – Luxury Cakes Experience 🎂</h1>
<p>Custom Cakes | Same Day Delivery | Premium Designs</p>
<a href="https://wa.me/919209062434" class="btn">Order Now</a>
</div>
</section>

<!-- ABOUT -->
<section class="section fade">
<h2>About Us</h2>
<p>We craft premium cakes designed to make your moments unforgettable.</p>
</section>

<!-- PARALLAX -->
<section class="section parallax">
<h2>Every Cake is a Masterpiece 🎨</h2>
</section>

<!-- GALLERY -->
<section class="section fade">
<h2>Our Creations</h2>
<div class="grid gallery">
<img src="images/cake1.jpg">
<img src="images/cake2.jpg">
<img src="images/cake3.jpg">
</div>
</section>

<!-- ORDER -->
<section class="section fade">
<h2>Order Your Cake</h2>

<form onsubmit="sendToWhatsApp(); return false;">
<input type="text" id="name" placeholder="Name" required>
<input type="tel" id="phone" placeholder="Phone" required>

<select id="cake">
<option>Custom Cake</option>
<option>Birthday Cake</option>
</select>

<input type="date" id="date">

<textarea id="message" placeholder="Message"></textarea>

<button class="btn">Order on WhatsApp</button>
</form>

</section>

<a href="https://wa.me/919209062434" class="whatsapp">💬</a>

<script>
const f=document.querySelectorAll('.fade');
window.addEventListener('scroll',()=>{
f.forEach(el=>{
if(el.getBoundingClientRect().top<window.innerHeight-100){
el.classList.add('show');
}
});
});

function sendToWhatsApp(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let cake=document.getElementById("cake").value;
let date=document.getElementById("date").value;
let message=document.getElementById("message").value;

let text="Hi I want to order cake 🎂%0a"
+"Name:"+name+"%0a"
+"Phone:"+phone+"%0a"
+"Cake:"+cake+"%0a"
+"Date:"+date+"%0a"
+"Message:"+message;

window.open("https://wa.me/919209062434?text="+text);
}
</script>

</body>
</html>
